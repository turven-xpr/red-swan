name: deutschy
description: "Deutschy — learn German the easy way."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  drift: ^2.24.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  google_mobile_ads: ^9.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: '>=6.0.0 <8.0.0'
  dio: ^5.9.2
  rxdart: ^0.28.0
  shared_preferences: ^2.3.5
  # Local notifications — OS-level daily-review reminders.  Only used
  # when the user explicitly enables them in Settings;  default off.
  flutter_local_notifications: ^17.2.3
  # tz database — used by flutter_local_notifications to schedule at
  # an exact wall-clock time across timezone changes.
  timezone: ^0.9.4
  # Image picker — used by the Settings screen "Change photo" action
  # to pull a fresh avatar out of the gallery.
  image_picker: ^1.1.2
  # Flutter's official i18n + localizations generation tooling.
  flutter_localizations:
    sdk: flutter
  # Lightweight replacement for the official gen_l10n — we author ARB
  # files by hand so a custom dictionary (with German, English,
  # French, Arabic copies of every visible string) ships without any
  # codegen step.  See `lib/src/core/i18n/strings.dart`.
  # Firebase Auth — backs Google & Apple social login via Firebase project
  # `deutschy-87c8e`.  All keys live in google-services.json + the iOS
  # GoogleService-Info.plist — never in this repository's source code.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.24.0
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/google_logo.png
    - assets/splash/splash_logo.png
